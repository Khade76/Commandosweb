name: Validate WARCON stats integration

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout WARCON upstream
        uses: actions/checkout@v4
        with:
          repository: warcon-app/warcon
          ref: main
          path: warcon

      - name: Apply WARCON integration
        working-directory: warcon
        run: |
          python3 ../integration/integrations/warcon/apply-session-deltas.py
          mkdir -p src/routes/api/public/player-stats
          cp ../integration/integrations/warcon/player-stats-route.ts src/routes/api/public/player-stats/+server.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install WARCON dependencies
        working-directory: warcon
        run: bun install --frozen-lockfile

      - name: Type-check WARCON integration
        working-directory: warcon
        run: bun run check

      - name: Run WARCON session tests
        working-directory: warcon
        run: bun test src/lib/server/sessions.test.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: integration/package-lock.json

      - name: Build 44th website
        working-directory: integration
        run: |
          npm ci
          npm run build

      - name: Lint website PHP
        working-directory: integration
        run: php -l public/api/player-stats.php
